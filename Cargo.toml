[package]
name = "codememory-prime"
version = "0.1.0"
edition = "2021"
description = "The high-performance Rust MCP codebase intelligence and persistent memory engine for AI coding agents."
license = "BSL-1.1"
repository = "https://github.com/rickieblevins/CodeMemoryPrime"
keywords = ["mcp", "codebase-memory", "rag", "ai-agent", "tree-sitter"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "cmp"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json"] }
notify = "6.1.1"
regex = "1.10"
chrono = "0.4"
uuid = { version = "1.7", features = ["v4"] }
pathdiff = "0.2"
tiktoken-rs = "0.12.0"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0.104"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2.1", features = ["pem"] }
base64 = "0.22"
